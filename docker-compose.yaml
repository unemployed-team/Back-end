services:
  db:
    image: postgis/postgis:15-3.4
    container_name: saferoom-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: saferoom
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    container_name: saferoom-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: