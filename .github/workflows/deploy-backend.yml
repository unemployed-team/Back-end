name: Deploy to AWS

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,docker-compose.yaml,init.sql"
          target: "/home/ec2-user/saferoom"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ec2-user/saferoom

            cat > .env << 'EOF'
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_HOST=localhost
            REDIS_PORT=6379
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            MOLIT_SERVICE_KEY=${{ secrets.MOLIT_SERVICE_KEY }}
            EOF

            docker-compose -f docker-compose.yaml down
            docker-compose -f docker-compose.yaml up -d

            pkill -f 'saferoom.*jar' || true
            sleep 5

            JAR_PATH=$(ls /home/ec2-user/saferoom/build/libs/*.jar | head -1)

            nohup setsid java -jar "$JAR_PATH" \
              > /home/ec2-user/saferoom/app.log 2>&1 \
              < /dev/null &

            disown $!
            sleep 5

            if pgrep -f "saferoom.*jar" > /dev/null; then
              echo "Spring Boot 실행 성공"
            else
              echo "Spring Boot 실행 실패"
              tail -50 /home/ec2-user/saferoom/app.log
              exit 1
            fi

            echo "배포 완료"
