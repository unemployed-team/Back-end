spring:
  application:
    name: saferoom

  datasource:
    url: jdbc:postgresql://localhost:5432/saferoom
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jwt:
    secret: ${JWT_SECRET}

oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:dummy-kakao-id}
    client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/v1/auth/kakao}
    token-uri: https://kauth.kakao.com/oauth/token
    resource-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    token-uri: https://oauth2.googleapis.com/token
    resource-uri: https://www.googleapis.com/oauth2/v3/userinfo